name: Daily Anomaly Scan

on:
  schedule:
    # 22:15 UTC Mon–Fri = 6:15 pm ET in summer / 5:15 pm ET in winter —
    # comfortably after the 4 pm ET close in both regimes.
    - cron: "15 22 * * 1-5"
  workflow_dispatch: {}   # manual "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python -m scanner

      - name: Commit results
        run: |
          git config user.name "anomaly-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "scan: $(date -u +%F)"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          fi
